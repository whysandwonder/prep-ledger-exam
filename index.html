<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preparation Ledger</title>
<meta name="theme-color" content="#1D5FD0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* ============================================================
   Preparation Ledger — design system
   Tokens → primitives → components → responsive → print
   ============================================================ */
:root{
  /* surfaces */
  --paper:#F5F7FB;            /* app canvas            */
  --paper-2:#FFFFFF;          /* raised surface        */
  --fill:#EEF2F8;             /* inset fill            */
  /* text */
  --ink:#0E1726;
  --ink-soft:#5B6B80;
  --ink-faint:#5E6C80;
  /* lines */
  --rule:#E3E9F2;
  --rule-2:#CFD9E8;
  /* accent */
  --deep:#2563EB;
  --deep-2:#1D4ED8;
  --deep-weak:#EAF1FE;
  --sky:#60A5FA;
  /* semantic */
  --green:#15803D;
  --amber:#B45309;
  --rust:#C0392F;
  --plum:#6D4AC4;
  /* elevation */
  --sh-1:0 1px 2px rgba(15,28,52,.05);
  --sh-2:0 2px 4px rgba(15,28,52,.05),0 8px 20px rgba(15,28,52,.06);
  --sh-3:0 12px 32px rgba(15,28,52,.14);
  --ring:0 0 0 3px rgba(37,99,235,.18);
  /* geometry */
  --r:14px; --r-sm:10px; --r-xs:8px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  /* type */
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:var(--sans);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.25,1);
}
html[data-theme="night"]{
  --paper:#0B1118; --paper-2:#131B25; --fill:#1A242F;
  --ink:#E8EEF7; --ink-soft:#96A6B9; --ink-faint:#7D8FA6;
  --rule:#1F2A37; --rule-2:#2E3D4E;
  --deep:#5B9BFF; --deep-2:#8CBAFF; --deep-weak:#132641; --sky:#8CBAFF;
  --green:#3DBE84; --amber:#D99B38; --rust:#EF7A6E; --plum:#AE92EE;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 2px 4px rgba(0,0,0,.35),0 10px 24px rgba(0,0,0,.4);
  --sh-3:0 16px 40px rgba(0,0,0,.55);
  --ring:0 0 0 3px rgba(91,155,255,.25);
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.55;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;font-family:inherit}
h1,h2,h3{font-family:var(--sans);font-weight:650;margin:0;letter-spacing:-.021em;color:var(--ink)}
h1{font-size:25px;line-height:1.2}
h2{font-size:18px;line-height:1.3}
h3{font-size:14.5px;line-height:1.35;font-weight:640}
p{margin:0}
.muted{color:var(--ink-soft)}
.small{font-size:12.5px;line-height:1.5}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.hide{display:none!important}
::selection{background:var(--deep-weak);color:var(--ink)}
:focus-visible{outline:2px solid var(--deep);outline-offset:2px;border-radius:6px}
*{transition:background-color .22s ease,color .18s ease,border-color .18s ease,box-shadow .22s ease,opacity .18s ease}
.bar i,.cd,.wkb i{transition:width .5s var(--ease),height .5s var(--ease),background-color .4s ease,color .25s ease}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--rule-2);border-radius:99px;border:3px solid var(--paper)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-faint)}

/* ---------- app bar ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;
  padding:0 clamp(14px,3vw,26px);height:68px;
  background:color-mix(in srgb,var(--paper-2) 88%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--rule)}
.burger{width:40px;height:40px;border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--paper-2);
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;flex:0 0 auto;box-shadow:var(--sh-1)}
.burger:hover{border-color:var(--rule-2);background:var(--fill)}
.burger i{width:16px;height:1.8px;background:var(--ink-soft);display:block;border-radius:2px;transition:background-color .2s}
.burger:hover i{background:var(--deep)}
.topmid{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px}
.topmid b{font-size:16px;font-weight:650;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topmid .small{font-size:12px;color:var(--ink-faint);letter-spacing:0}
.pill{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:var(--r-sm);
  padding:6px 12px;background:var(--paper-2);box-shadow:var(--sh-1);white-space:nowrap}
.pill b{font-size:17px;font-weight:660;line-height:1.15;letter-spacing:-.02em}
.pill .small{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--ink-faint)}
.pill.past{opacity:.5}
.pill.streak{border-color:color-mix(in srgb,var(--amber) 35%,var(--rule));
  background:color-mix(in srgb,var(--amber) 8%,var(--paper-2))}
.pill.streak b{color:var(--amber)}
.pill.streak.cold{border-color:var(--rule);background:var(--paper-2)}
.pill.streak.cold b,.pill.streak.cold .fl{color:var(--ink-faint)}
.fl{display:inline-flex;color:var(--amber);line-height:0}
@media (prefers-reduced-motion:no-preference){.pill.streak:not(.cold) .fl{animation:flick 2.6s ease-in-out infinite;transform-origin:50% 90%}}
@keyframes flick{0%,100%{transform:scale(1) rotate(0)}35%{transform:scale(1.09) rotate(-3deg)}65%{transform:scale(.98) rotate(3deg)}}
.icon{width:38px;height:38px;border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--paper-2);
  flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-soft);box-shadow:var(--sh-1)}
.icon:hover{border-color:var(--rule-2);color:var(--deep);background:var(--fill)}
.icon svg{width:17px;height:17px;display:block}
.icon.off{color:var(--ink-faint);position:relative}
.icon.off::after{content:"";position:absolute;left:9px;right:9px;top:50%;height:1.5px;background:var(--rust);
  transform:rotate(-20deg);border-radius:2px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(9,17,28,.5);z-index:40;backdrop-filter:blur(3px);animation:fade .24s ease both}
.scrim.out{animation:fade .2s ease both reverse}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateX(-102%)}to{transform:translateX(0)}}
.drawer{position:fixed;top:0;left:0;bottom:0;width:268px;z-index:41;background:var(--paper-2);
  border-right:1px solid var(--rule);padding:18px 14px;overflow:auto;
  animation:slide .3s var(--ease) both;box-shadow:var(--sh-3)}
.drawer.out{animation:slide .22s cubic-bezier(.4,0,1,1) both reverse}
.drawer .bh{padding:4px 10px 16px;border-bottom:1px solid var(--rule);margin-bottom:12px}
.drawer .bh b{font-size:16px;font-weight:660;letter-spacing:-.02em;display:block}
.drawer .bh .small{color:var(--ink-faint)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;width:100%;gap:11px;align-items:center;background:none;border:0;padding:10px 12px;
  border-radius:var(--r-sm);text-align:left;color:var(--ink-soft);font-size:14px;font-weight:500;
  animation:navin .3s ease both}
@keyframes navin{from{opacity:0;transform:translateX(-7px)}to{opacity:1;transform:none}}
.nav button:hover{background:var(--fill);color:var(--ink)}
.nav button.on{background:var(--deep);color:#fff;font-weight:600;box-shadow:0 1px 3px rgba(37,99,235,.35)}
.nav .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.45;flex:0 0 5px}
.nav button.on .dot{opacity:1}

/* ---------- page shell ---------- */
.wrap{max-width:1160px;margin:0 auto;padding:clamp(18px,3vw,28px) clamp(14px,3vw,26px) 120px}
body[data-view="mobile"] .wrap{max-width:460px}
body[data-view="mobile"] .g4,body[data-view="mobile"] .g3{grid-template-columns:1fr 1fr}
body[data-view="mobile"] .g2{grid-template-columns:1fr}
.sec{margin-top:var(--s5)}
.sec>h2,.sec>h3{margin-bottom:10px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}

/* ---------- card ---------- */
.card{background:var(--paper-2);border:1px solid var(--rule);border-radius:var(--r);
  padding:16px 18px;box-shadow:var(--sh-1)}
.card:hover{box-shadow:var(--sh-2)}
.card>h2:first-child,.card>h3:first-child{margin-bottom:2px}

/* ---------- stat ---------- */
.stat{display:flex;flex-direction:column;gap:3px;justify-content:center}
.stat b{font-size:27px;font-weight:660;line-height:1.1;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;display:block;color:var(--ink)}
.stat span{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.055em;
  font-weight:600;line-height:1.35}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--rule-2);background:var(--paper-2);color:var(--ink);
  padding:8px 14px;border-radius:var(--r-sm);font-size:14px;font-weight:550;
  min-height:36px;box-shadow:var(--sh-1);white-space:nowrap}
.btn:hover{background:var(--fill);border-color:var(--ink-faint)}
.btn:active{transform:translateY(.5px)}
.btn:disabled{opacity:.42;pointer-events:none}
.btn.p{background:var(--deep);border-color:var(--deep);color:#fff;box-shadow:0 1px 2px rgba(37,99,235,.3)}
.btn.p:hover{background:var(--deep-2);border-color:var(--deep-2);color:#fff}
.btn.g{background:none;border-color:transparent;color:var(--ink-faint);padding:5px 8px;
  min-height:30px;box-shadow:none;font-weight:500;font-size:13px}
.btn.g:hover{background:var(--fill);color:var(--ink);border-color:transparent}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:var(--r-xs);min-height:30px}
.play{color:var(--deep)}
.play svg{width:13px;height:13px}
.btn.g.play:hover{background:var(--deep-weak);color:var(--deep)}
@media (pointer:coarse){.btn{min-height:42px}.btn.sm,.btn.g{min-height:36px}}

/* ---------- segmented ---------- */
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r-sm);overflow:hidden;
  background:var(--fill);padding:2px;gap:2px;box-shadow:var(--sh-1)}
.seg button{border:0;background:transparent;padding:6px 12px;color:var(--ink-soft);font-size:13px;
  font-weight:550;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:30px}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--paper-2);color:var(--deep);box-shadow:var(--sh-1)}
.seg button svg{width:15px;height:15px}

/* ---------- fields ---------- */
input,select,textarea{background:var(--paper-2);border:1px solid var(--rule-2);border-radius:var(--r-sm);
  padding:8px 11px;width:100%;min-height:38px;color:var(--ink);box-shadow:var(--sh-1)}
textarea{min-height:auto;line-height:1.55;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--ink-faint)}
input:hover,select:hover,textarea:hover{border-color:var(--ink-faint)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--deep);box-shadow:var(--ring)}
select{appearance:none;-webkit-appearance:none;padding-right:30px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
label.small{display:block}
label.small>input,label.small>select,label.small>textarea{margin-top:5px;font-size:15px;color:var(--ink)}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--rule);font-size:14px;vertical-align:middle}
th{font-size:10.5px;color:var(--ink-faint);font-weight:650;text-transform:uppercase;letter-spacing:.07em;
  background:var(--fill);border-bottom:1px solid var(--rule)}
thead th:first-child{border-top-left-radius:var(--r)}
thead th:last-child{border-top-right-radius:var(--r)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--fill)}

/* ---------- chips, tags ---------- */
.tag{display:inline-flex;align-items:center;font-size:11px;padding:3px 9px;border-radius:6px;
  border:1px solid var(--rule);background:var(--fill);color:var(--ink-soft);white-space:nowrap;
  font-weight:550;letter-spacing:.01em}
.chip{border:1px solid var(--rule-2);background:var(--paper-2);color:var(--ink-soft);border-radius:999px;
  padding:5px 12px;font-size:12px;font-weight:550;min-height:30px}
.chip:hover{border-color:var(--ink-faint);color:var(--ink)}
.chip.on{background:var(--deep-weak);border-color:var(--deep);color:var(--deep);font-weight:650}
.chip.sm{padding:3px 10px;font-size:11.5px;min-height:26px}
kbd{border:1px solid var(--rule-2);border-bottom-width:2px;border-radius:6px;padding:2px 7px;
  font-family:var(--mono);font-size:11.5px;background:var(--fill);color:var(--ink-soft)}

/* ---------- empty, hero, bars ---------- */
.empty{padding:34px 22px;text-align:center;color:var(--ink-faint);border:1px dashed var(--rule-2);
  border-radius:var(--r);background:var(--fill);font-size:13.5px}
.hero{border-radius:var(--r);padding:18px 20px;border:1px solid transparent;box-shadow:var(--sh-1)}
.bar{height:8px;background:var(--fill);border-radius:99px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--rule)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--deep));border-radius:99px}

/* ---------- tasks ---------- */
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 6px;border-bottom:1px solid var(--rule);
  border-radius:var(--r-xs)}
.task:last-child{border-bottom:0}
.task:hover{background:var(--fill)}
.task[draggable]{cursor:grab}
.task.drag{opacity:.35}
.task.over{background:var(--deep-weak);box-shadow:inset 0 2px 0 var(--deep)}
.grip{color:var(--ink-faint);cursor:grab;padding:3px 2px 0;user-select:none;display:inline-flex;line-height:0;opacity:.55}
.grip svg{width:13px;height:13px}
.task:hover .grip{opacity:1}
.chk{width:19px;height:19px;flex:0 0 19px;margin-top:3px;border:1.5px solid var(--rule-2);border-radius:6px;
  background:var(--paper-2);padding:0}
.chk:hover{border-color:var(--deep)}
.chk.on{background:var(--deep);border-color:var(--deep);position:relative}
.chk.on::after{content:"";position:absolute;left:6px;top:2px;width:4px;height:9px;border:solid #fff;
  border-width:0 2px 2px 0;transform:rotate(42deg)}
.task.done .t{text-decoration:line-through;color:var(--ink-faint)}
.t{flex:1;min-width:0}

/* ---------- timer ---------- */
.timer-card{border-left:3px solid var(--deep);
  background:linear-gradient(145deg,var(--deep-weak) 0%,var(--paper-2) 58%)}
.clock{font-family:var(--sans);font-size:58px;line-height:1;font-weight:620;letter-spacing:-.045em;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--rust);display:inline-block;margin-right:7px;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--rust) 20%,transparent)}
@media (prefers-reduced-motion:no-preference){.live .pulse{animation:p 1.8s infinite}}
@keyframes p{50%{opacity:.3}}
.tick.pop{animation:pop .42s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{40%{transform:scale(1.07)}100%{transform:scale(1)}}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-size:10px;color:var(--ink-faint);text-align:center;padding-bottom:4px;
  text-transform:uppercase;letter-spacing:.07em;font-weight:650}
.cd{aspect-ratio:1;border:1px solid var(--rule);border-radius:var(--r-xs);padding:6px;background:var(--fill);
  display:flex;flex-direction:column;justify-content:space-between;font-size:11px;overflow:hidden;text-align:left;
  color:var(--ink-soft)}
.cd b{font-weight:600;font-size:11.5px}
.cd .h{font-size:13px;font-weight:650;letter-spacing:-.02em}
.cd.out{opacity:.4}
.cd.today{outline:2px solid var(--deep);outline-offset:1px;border-color:transparent}
.cd:hover{border-color:var(--deep);transform:translateY(-1px);box-shadow:var(--sh-2)}

/* ---------- week strip ---------- */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;margin-top:14px}
.wkd{display:flex;flex-direction:column;align-items:center;gap:6px}
.wkd.fut{opacity:.4}
.wkb{width:100%;height:58px;background:var(--fill);border-radius:var(--r-xs);display:flex;align-items:flex-end;
  overflow:hidden;box-shadow:inset 0 0 0 1px var(--rule)}
.wkb i{display:block;width:100%;border-radius:var(--r-xs)}
.wkd.now .wkb{outline:2px solid var(--deep);outline-offset:1px}

/* ---------- dock, notes ---------- */
.dock{position:fixed;right:20px;bottom:20px;z-index:35;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:12px 20px;min-height:46px;
  background:var(--deep);color:#fff;border:0;font-weight:600;font-size:14px;
  box-shadow:0 6px 20px rgba(37,99,235,.38),0 1px 2px rgba(0,0,0,.1)}
.fab:hover{background:var(--deep-2);transform:translateY(-1px);box-shadow:0 10px 26px rgba(37,99,235,.45)}
.fab svg{width:16px;height:16px}
.notepad{width:340px;max-width:86vw;background:var(--paper-2);border:1px solid var(--rule);border-radius:var(--r);
  padding:16px;box-shadow:var(--sh-3)}
.notelist{max-height:220px;overflow:auto;margin:10px 0}
.note{border-left:3px solid var(--amber);padding:7px 10px;margin-bottom:7px;background:var(--fill);
  border-radius:0 var(--r-xs) var(--r-xs) 0}
.fileitem{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule)}
.fileitem:last-child{border-bottom:0}

/* ---------- toast, banner ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:500;z-index:60;box-shadow:var(--sh-3);
  display:flex;align-items:center;max-width:calc(100vw - 32px);animation:toastin .3s var(--ease) both}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
#toast .btn{background:rgba(255,255,255,.14);color:#fff;border-color:transparent;box-shadow:none;min-height:26px}
#toast .btn:hover{background:rgba(255,255,255,.26)}
.banner{max-width:1160px;margin:16px auto -6px;padding:0 clamp(14px,3vw,26px)}
.banner .in{border:1px solid color-mix(in srgb,var(--amber) 38%,var(--rule));border-left:3px solid var(--amber);
  border-radius:var(--r);padding:12px 16px;background:color-mix(in srgb,var(--amber) 6%,var(--paper-2));
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;font-size:13.5px;box-shadow:var(--sh-1)}

/* ---------- modal / dialog ---------- */
.modal{position:fixed;inset:0;background:rgba(9,17,28,.52);z-index:70;display:flex;align-items:center;
  justify-content:center;padding:20px;backdrop-filter:blur(3px);animation:fade .2s ease both}
.sheet{background:var(--paper-2);border:1px solid var(--rule);border-radius:18px;padding:22px;max-width:520px;
  width:100%;max-height:85vh;overflow:auto;box-shadow:var(--sh-3);animation:sheetin .26s var(--ease) both}
@keyframes sheetin{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}

/* ---------- onboarding ---------- */
.onb{max-width:540px;margin:7vh auto;padding:0 20px}
.onb h1{margin-bottom:6px}
.choice{display:block;width:100%;text-align:left;border:1px solid var(--rule-2);background:var(--paper-2);
  border-radius:var(--r);padding:14px 17px;margin-bottom:10px;box-shadow:var(--sh-1)}
.choice:hover{border-color:var(--deep);background:var(--fill)}
.choice.on{border-color:var(--deep);background:var(--deep-weak);box-shadow:inset 3px 0 0 var(--deep),var(--sh-1)}
.choice b{display:block;font-weight:620;margin-bottom:2px}

/* ---------- density ---------- */
body[data-density="compact"]{font-size:14px}
body[data-density="compact"] .card{padding:11px 13px}
body[data-density="compact"] .sec{margin-top:16px}
body[data-density="compact"] th,body[data-density="compact"] td{padding:6px 10px;font-size:13px}
body[data-density="compact"] .task{padding:6px 4px}
body[data-density="compact"] .clock{font-size:44px}
body[data-density="compact"] .stat b{font-size:22px}
body[data-density="compact"] .grid{gap:9px}
body[data-density="compact"] .wkb{height:42px}
body[data-density="compact"] .hero{padding:13px 15px}

/* ---------- guided tour ---------- */
#tour{position:fixed;inset:0;z-index:80;pointer-events:none}
#tour.on{pointer-events:auto}
#tourMask{position:absolute;inset:0}
#tourMask rect.hole{transition:x .45s var(--ease),y .45s var(--ease),width .45s var(--ease),height .45s var(--ease)}
#tourRing{position:absolute;border:2px solid var(--sky);border-radius:var(--r);pointer-events:none;
  box-shadow:0 0 0 4px rgba(96,165,250,.22);transition:all .45s var(--ease)}
@media (prefers-reduced-motion:no-preference){#tourRing{animation:ring 2.2s ease-in-out infinite}}
@keyframes ring{50%{box-shadow:0 0 0 10px rgba(96,165,250,.07)}}
#tourArrow{position:absolute;inset:0;overflow:visible;pointer-events:none}
#tourArrow path{fill:none;stroke:var(--sky);stroke-width:2.4;stroke-linecap:round;
  stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .55s .12s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.tbub{position:absolute;width:336px;max-width:calc(100vw - 32px);background:var(--paper-2);
  border:1px solid var(--rule);border-radius:18px;padding:18px 20px;box-shadow:var(--sh-3);
  animation:bub .34s var(--ease) both}
@keyframes bub{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.tbub h3{font-size:16.5px}
.tbub p{margin:8px 0 0;font-size:13.5px;color:var(--ink-soft);line-height:1.6}
.tdots{display:flex;gap:5px;align-items:center}
.tdots i{width:6px;height:6px;border-radius:50%;background:var(--rule-2);display:block;transition:all .3s}
.tdots i.on{background:var(--deep);width:18px;border-radius:3px}
.tcenter{left:50%;top:50%;transform:translate(-50%,-50%);width:430px}
@keyframes bubC{from{opacity:0;transform:translate(-50%,-46%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%)}}
.tbub.tcenter{animation:bubC .36s var(--ease) both}

/* ---------- print ---------- */
@media print{
  .top,.dock,.drawer,.scrim,.noprint,#tour{display:none!important}
  body{background:#fff;color:#000}
  .card{break-inside:avoid;border-color:#ddd;box-shadow:none}

  th{background:#f3f3f3}
}

.credit{margin:34px auto 0;padding-top:16px;border-top:1px solid var(--rule);
  max-width:1160px;text-align:center;font-size:11px;letter-spacing:.06em;
  color:var(--ink-faint);opacity:.75;-webkit-user-select:none;user-select:none}

/* ---------- native app shell ---------- */

  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

  -webkit-user-select:none;user-select:none}
button,.cd,.chk,.task{touch-action:manipulation}
.wrap,.drawer,.notelist,.sheet{-webkit-overflow-scrolling:touch}

  .btn:hover,.icon:hover,.chip:hover,.cd:hover,.card:hover,.task:hover,.nav button:hover,.choice:hover{
    background:inherit;border-color:inherit;color:inherit;box-shadow:inherit;transform:none}
  .btn:active,.chip:active{background:var(--fill);transform:scale(.97)}
  .btn.p:active{background:var(--deep-2)}
  .icon:active,.burger:active{background:var(--fill);transform:scale(.94)}
  .cd:active{transform:scale(.95)}
  .nav button:active{background:var(--fill)}

}
/* bottom tab bar — mobile only; the drawer still holds everything */
.tabbar{display:none}
.tabbar .more.on,.tabbar button.on{color:var(--deep)}
@media (max-width:720px){
  .tabbar{display:grid;position:fixed;left:0;right:0;bottom:0;z-index:36;
    grid-template-columns:repeat(5,1fr);gap:2px;

  .tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    background:none;border:0;padding:7px 2px 5px;border-radius:var(--r-sm);

  .tabbar button svg{width:21px;height:21px;stroke-width:1.7}
  .tabbar button.on{color:var(--deep);background:var(--deep-weak)}
  .wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom))}

  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .top{position:sticky;padding-top:0}

}

}

<body>
<div id="root"></div>
<div class="toast hide" id="toast"></div>
<script>
if(typeof structuredClone!=='function')var structuredClone=o=>JSON.parse(JSON.stringify(o));
const KEY='prep-ledger-v2';
const todayISO=()=>new Date().toLocaleDateString('en-CA');
const uid=()=>Math.random().toString(36).slice(2,10);
const PRESETS={
 ESE:{label:'ESE',stages:['Prelims','Mains'],subjects:['Thermodynamics','Fluid Mechanics','Heat Transfer','IC Engines','Refrigeration & AC','Turbomachinery','Strength of Materials','Theory of Machines','Machine Design','Materials Science','Manufacturing','Industrial Engineering','Mechatronics','General Studies & Engineering Aptitude']},
 CSE:{label:'CSE',stages:['Prelims','Mains'],subjects:['GS Paper I','GS Paper II','GS Paper III','GS Paper IV','Essay','Optional','CSAT','Current Affairs']},
 GATE:{label:'GATE',stages:[],subjects:['Engineering Mathematics','Core Subject 1','Core Subject 2','Aptitude']},
 STATE:{label:'State PSC',stages:['Prelims','Mains'],subjects:['General Studies','Optional','Current Affairs','State-specific']},
 OTHER:{label:'My exam',stages:[],subjects:['Subject 1','Subject 2']}
};
const DEF={v:2,setup:false,
 settings:{name:'',exam:'CSE',examLabel:'CSE',stage:'',examDate:'',goalHours:6,theme:'day',view:'auto',revisionOn:false,
  autoFolder:false,lastAuto:'',idleGuard:true,idleMins:120,autoBackup:true,lastBackup:'',countdownMin:50,stages:[],stageDates:{},shortcuts:true,tourDone:false,density:'comfortable'},
 subjects:[],tasks:{},sessions:[],notes:[],pyq:[],revisions:[],files:[],recurring:[],weekly:{},recurLast:'',tests:[],
 timer:{running:false,startedAt:null,acc:0,subject:'',topic:'',note:'',mode:'up',target:3000,idleAt:0}};
let S=load();
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r)return merge(structuredClone(DEF),r);}catch(e){}return structuredClone(DEF);}
function merge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k]))a[k]=merge(a[k]||{},b[k]);else a[k]=b[k];}return a;}
const APP_VERSION='2.3';
const KV=(()=>{let db;const open=()=>db?Promise.resolve(db):new Promise((res,rej)=>{
 const r=indexedDB.open('prep-ledger-db',1);
 r.onupgradeneeded=()=>r.result.createObjectStore('kv');
 r.onsuccess=()=>{db=r.result;res(db);};r.onerror=()=>rej(r.error);});
 return{get:k=>open().then(d=>new Promise(res=>{const q=d.transaction('kv').objectStore('kv').get(k);
   q.onsuccess=()=>res(q.result);q.onerror=()=>res(null);})).catch(()=>null),
  set:(k,v)=>open().then(d=>new Promise(res=>{const t=d.transaction('kv','readwrite');
   t.objectStore('kv').put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>res(false);})).catch(()=>false)};
})();
let quotaWarned=false;
let sT;function save(){clearTimeout(sT);sT=setTimeout(()=>{
 S.savedAt=Date.now();S.version=APP_VERSION;
 const json=JSON.stringify(S);
 KV.set(KEY,json);                                   /* roomy store, hundreds of MB */
 try{localStorage.setItem(KEY,json);}                /* fast mirror for instant start */
 catch(e){if(!quotaWarned){quotaWarned=true;
   toast('This browser’s quick store is full — your data is safe in the larger store.');}}
},100);}
function saveNow(){clearTimeout(sT);S.savedAt=Date.now();S.version=APP_VERSION;
 const json=JSON.stringify(S);
 try{localStorage.setItem(KEY,json);}catch(e){}
 KV.set(KEY,json);}
async function reconcile(){
 try{const raw=await KV.get(KEY);if(!raw)return;
  const o=JSON.parse(raw);
  if((o.savedAt||0)>(S.savedAt||0)+500){S=merge(structuredClone(DEF),o);render();}
 }catch(e){}
}
async function autoBackup(force){
 if(!S.settings.autoFolder)return false;
 if(!force&&S.settings.lastAuto===todayISO())return false;
 try{const h=await IDB.get('backupDir');if(!h)return false;
  if(h.queryPermission&&await h.queryPermission({mode:'readwrite'})!=='granted'){
   if(!force)return false;
   if(await h.requestPermission({mode:'readwrite'})!=='granted')return false;}
  const payload={_app:'preparation-ledger',_version:APP_VERSION,_schema:2,_exportedAt:new Date().toISOString(),...S};
  const f=await h.getFileHandle('prep-ledger-'+todayISO()+'.json',{create:true});
  const w=await f.createWritable();await w.write(JSON.stringify(payload,null,2));await w.close();
  S.settings.lastAuto=todayISO();S.settings.lastBackup=todayISO();save();return true;}
 catch(e){return false;}
}
async function storageUse(){
 try{const e=await navigator.storage.estimate();
  return e&&e.usage!=null?`${(e.usage/1048576).toFixed(1)} MB used of about ${(e.quota/1048576).toFixed(0)} MB available`:'';}
 catch(e){return '';}
}
function toast(m){const t=document.getElementById('toast');t.innerHTML=esc(m);t.classList.remove('hide');
 clearTimeout(t._x);t._x=setTimeout(()=>t.classList.add('hide'),2600);}
let undoSnap=null;
function undoable(label,fn){
 undoSnap=JSON.stringify(S);
 fn();save();render();
 const t=document.getElementById('toast');
 t.innerHTML=`${esc(label)} <button class="btn sm" data-a="undo" style="margin-left:10px;padding:3px 10px">Undo</button>`;
 t.classList.remove('hide');clearTimeout(t._x);t._x=setTimeout(()=>{t.classList.add('hide');undoSnap=null;},8000);
}
function doUndo(){
 if(!undoSnap)return;
 S=merge(structuredClone(DEF),JSON.parse(undoSnap));undoSnap=null;
 document.getElementById('toast').classList.add('hide');save();render();toast('Restored.');
}

const pad=n=>String(n).padStart(2,'0');
const hms=s=>`${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(Math.floor(s%60))}`;
const hm=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}h ${m}m`:`${m}m`;};
const hrs=s=>s/3600;
const fmtDate=d=>new Date(d+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
const shift=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA');};
const between=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const secOn=d=>S.sessions.filter(x=>x.date===d).reduce((a,b)=>a+b.seconds,0);
const tasksOn=d=>(S.tasks[d]||=[]);
const lastN=(n,end=todayISO())=>{const a=[];for(let i=n-1;i>=0;i--)a.push(shift(end,-i));return a;};
const subNames=()=>S.subjects.map(s=>s.name);
const subOpts=v=>S.subjects.map(s=>`<option ${s.name===v?'selected':''}>${esc(s.name)}</option>`).join('');
const findSub=n=>S.subjects.find(s=>s.name===n);
const IGNORE=/interview|personality|viva/i;
const trackStages=()=>(S.settings.stages||[]).filter(x=>x&&!IGNORE.test(x));
const hasStages=()=>trackStages().length>1;
const parseStages=v=>v.split(',').map(x=>x.trim()).filter(Boolean).slice(0,5);
function stageCounters(){
 const sd=S.settings.stageDates||{},ST=(S.settings.stages||[]).filter(x=>sd[x]);
 if(ST.length)return ST.map(n=>({n,d:sd[n]})).sort((a,b)=>a.d<b.d?-1:1);
 return S.settings.examDate?[{n:'',d:S.settings.examDate}]:[];
}
function syncExamDate(){
 const c=stageCounters().filter(x=>x.d>=todayISO());
 const all=stageCounters();
 const pick=c.length?c[0].d:(all.length?all[all.length-1].d:S.settings.examDate);
 if(pick)S.settings.examDate=pick;
}
/* free-text subject box: your subjects plus anything used before */
function subField(id,value,used,ph){
 const opts=[...new Set([...subNames(),...used])].filter(Boolean);
 return`<input id="${id}" list="${id}-l" value="${esc(value||'')}" placeholder="${ph||'Paper or subject'}" autocomplete="off">
 <datalist id="${id}-l">${opts.map(o=>`<option>${esc(o)}</option>`).join('')}</datalist>`;
}
function val(id){const e=document.getElementById(id);return e?e.value.trim():'';}
function dl(blob,name){try{const u=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(u),1000);return true;}
 catch(e){toast('This browser blocked the download.');return false;}}

const tSecs=()=>S.timer.acc+(S.timer.running?(Date.now()-S.timer.startedAt)/1000:0);
function tStart(){if(S.timer.running)return;
 if(S.timer.day&&S.timer.day!==todayISO()){S.timer.acc=0;S.timer.taskId=null;}
 S.timer.day=todayISO();S.timer.running=true;S.timer.startedAt=Date.now();save();render();}
function tPause(){if(!S.timer.running)return;S.timer.acc=tSecs();S.timer.running=false;S.timer.startedAt=null;save();render();}
const tShown=()=>S.timer.mode==='down'?Math.max(0,S.timer.target-tSecs()):tSecs();
function tSave(){const s=Math.round(tSecs());if(s<30)return toast('Under 30 seconds — nothing to save.');
 S.sessions.push({id:uid(),date:todayISO(),seconds:s,subject:S.timer.subject||subNames()[0]||'General',topic:S.timer.topic,note:S.timer.note,at:Date.now()});
 if(S.timer.taskId){const t=find(S.timer.taskId);if(t&&!t.done)t.done=true;}
 S.timer={running:false,startedAt:null,acc:0,subject:S.timer.subject,topic:S.timer.topic,note:'',mode:S.timer.mode,target:S.timer.target,idleAt:0,taskId:null};
 save();render();toast('Saved '+hm(s)+'.');}

let lastAct=Date.now();
['click','keydown','pointerdown'].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now();},true));
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();
 o.connect(g);g.connect(a.destination);o.frequency.value=660;g.gain.value=.08;o.start();
 setTimeout(()=>{o.stop();a.close();},450);}catch(e){}}
setInterval(()=>{
 const T=S.timer;
 if(T.running&&T.mode==='down'&&tSecs()>=T.target){beep();tSave();toast('Countdown finished — session saved.');return;}
 if(T.running&&S.settings.idleGuard&&Date.now()-lastAct>S.settings.idleMins*60000){
  T.idleAt=lastAct;tPause();beep();return;}
 const c=document.getElementById('clock');if(c)c.textContent=hms(tShown());
 const n=document.getElementById('now');
 if(n)n.textContent=new Date().toLocaleString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
 document.title=(S.timer.running?hms(tShown())+' · ':'')+hrs(secOn(todayISO())).toFixed(1)+'h today · Ledger';
},1000);

function stats(range=30){
 const days=lastN(range),per=days.map(d=>({d,s:secOn(d)}));
 const total=per.reduce((a,b)=>a+b.s,0),studied=per.filter(x=>x.s>0).length;
 let streak=0,cur=todayISO();if(!secOn(cur))cur=shift(cur,-1);
 while(secOn(cur)>0){streak++;cur=shift(cur,-1);}
 let best=0,run=0,p=null;[...new Set(S.sessions.map(s=>s.date))].sort().forEach(d=>{run=(p&&between(p,d)===1)?run+1:1;best=Math.max(best,run);p=d;});
 const wd=[0,0,0,0,0,0,0],wc=[0,0,0,0,0,0,0];
 per.forEach(x=>{const i=new Date(x.d+'T00:00:00').getDay();wd[i]+=x.s;wc[i]++;});
 const avgWd=wd.map((s,i)=>wc[i]?s/wc[i]:0),names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
 const hoursArr=Array(24).fill(0);S.sessions.forEach(s=>{if(s.at)hoursArr[new Date(s.at).getHours()]+=s.seconds;});
 let td=0,tt=0;days.forEach(d=>{const L=tasksOn(d);tt+=L.length;td+=L.filter(x=>x.done).length;});
 const prior=lastN(range,shift(todayISO(),-range)).reduce((a,d)=>a+secOn(d),0);
 const bySub={};S.sessions.filter(s=>days.includes(s.date)).forEach(s=>bySub[s.subject]=(bySub[s.subject]||0)+s.seconds);
 return{days,per,total,studied,streak,best,avgWd,names,
  bestI:avgWd.indexOf(Math.max(...avgWd)),worstI:avgWd.indexOf(Math.min(...avgWd)),
  peak:hoursArr.indexOf(Math.max(...hoursArr)),td,tt,prior,bySub,avg:total/range};
}
function backlog(){const out=[];Object.keys(S.tasks).forEach(d=>{if(d<todayISO())tasksOn(d).filter(t=>!t.done).forEach(t=>out.push({...t,d}));});
 return out.sort((a,b)=>a.d<b.d?-1:1);}

function barChart(data,{h=160,goal=null,color='var(--deep)'}={}){
 const w=Math.max(300,data.length*Math.min(34,Math.max(11,520/data.length)));
 const max=Math.max(goal||0,...data.map(d=>d.v),1),bw=w/data.length,pb=20;let b='';
 data.forEach((d,i)=>{const bh=(d.v/max)*(h-pb-6);
  b+=`<rect x="${i*bw+bw*.17}" y="${h-pb-bh}" width="${bw*.66}" height="${Math.max(bh,d.v>0?2:0)}" rx="3" fill="${color}" opacity="${d.v?1:.22}"><title>${esc(d.l)}: ${d.v.toFixed(2)}</title></rect>`;
  if(data.length<=16||i%Math.ceil(data.length/10)===0)b+=`<text x="${i*bw+bw/2}" y="${h-6}" font-size="10" fill="var(--ink-soft)" text-anchor="middle">${esc(d.s??d.l)}</text>`;});
 if(goal){const y=h-pb-(goal/max)*(h-pb-6);b+=`<line x1="0" x2="${w}" y1="${y}" y2="${y}" stroke="var(--rust)" stroke-dasharray="4 4"/>`;}
 return`<div style="overflow-x:auto"><svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="max-width:100%">${b}</svg></div>`;
}
const SVG=(d,extra='')=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${d}</svg>`;
const ICO={
 moon:SVG('<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"/>'),
 sun:SVG('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
 keyboard:SVG('<rect x="2" y="6" width="20" height="12" rx="2.5"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/>'),

function ramp(h){
 const t=Math.max(0,Math.min(1,h/10));
 const hue=142+(212-142)*t, sat=48+(74-48)*t, li=86-(86-26)*t;
 return`hsl(${hue.toFixed(0)} ${sat.toFixed(0)}% ${li.toFixed(0)}%)`;
}
const rampInk=h=>h/10>.45?'#FFFFFF':'var(--ink)';
const COLS=['#0F5C52','#5B3E7A','#9A6B12','#9E3B2E','#2E6DA4','#4B7F52','#8A5A44','#6C6F7B','#A0436F','#3F7E76'];
function donut(entries){
 const tot=entries.reduce((a,b)=>a+b[1],0)||1;let a=-Math.PI/2,p='';
 entries.forEach(([k,v],i)=>{const ang=v/tot*2*Math.PI,x1=60+48*Math.cos(a),y1=60+48*Math.sin(a);a+=ang;
  p+=`<path d="M60,60 L${x1},${y1} A48,48 0 ${ang>Math.PI?1:0} 1 ${60+48*Math.cos(a)},${60+48*Math.sin(a)} Z" fill="${COLS[i%COLS.length]}"><title>${esc(k)}: ${hm(v)}</title></path>`;});
 p+=`<circle cx="60" cy="60" r="27" fill="var(--paper-2)"/>`;
 return`<div class="row" style="gap:18px"><svg width="120" height="120" viewBox="0 0 120 120">${p}</svg>
 <div style="display:grid;gap:4px">${entries.map(([k,v],i)=>`<div class="row small" style="gap:6px">
 <span style="width:9px;height:9px;border-radius:2px;background:${COLS[i%COLS.length]}"></span>${esc(k)} <span class="muted num">${hm(v)}</span></div>`).join('')}</div></div>`;
}

let calRange=30;
function calendar(){
 if(calRange===7){
  const days=lastN(7),max=Math.max(...days.map(secOn),1);
  return`<div class="cal">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dow">${d}</div>`).join('')}
   ${days.map(d=>cell(d,max)).join('')}</div>`;
 }
 const months=calRange===30?1:3,base=new Date(todayISO()+'T00:00:00');
 const max=Math.max(...lastN(95).map(secOn),1);let out='';
 for(let m=months-1;m>=0;m--){
  const dt=new Date(base.getFullYear(),base.getMonth()-m,1);
  const first=dt.getDay(),len=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();
  let mh=0;for(let i=1;i<=len;i++)mh+=secOn(new Date(dt.getFullYear(),dt.getMonth(),i).toLocaleDateString('en-CA'));
  out+=`<div class="sec"><div class="row" style="justify-content:space-between">
   <h3>${dt.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</h3><span class="small muted num">${hrs(mh).toFixed(1)}h</span></div>
   <div class="cal" style="margin-top:8px">${['S','M','T','W','T','F','S'].map(d=>`<div class="dow">${d}</div>`).join('')}
   ${Array(first).fill('<div></div>').join('')}
   ${Array.from({length:len},(_,i)=>cell(new Date(dt.getFullYear(),dt.getMonth(),i+1).toLocaleDateString('en-CA'),max)).join('')}</div></div>`;
 }
 return out;
}
function cell(d,max){

 const H=hrs(s);

  title="${fmtDate(d)} — ${s?hm(s):'nothing logged'}" style="${s?`background:${ramp(H)};color:${rampInk(H)};border-color:transparent;`:''}">
  <b class="num">${new Date(d+'T00:00:00').getDate()}</b>

}

function animateHero(){

 const to=+el.dataset.to,from=heroLast===null?to:heroLast;heroLast=to;
 if(from===to)return;
 el.classList.add('pop');setTimeout(()=>el.classList.remove('pop'),420);

function weekDays(off=0){
 const n=new Date(todayISO()+'T00:00:00');const dow=(n.getDay()+6)%7;
 const mon=shift(todayISO(),-dow+off*7);return Array.from({length:7},(_,i)=>shift(mon,i));
}

const IDB=(()=>{let db;const open=()=>db?Promise.resolve(db):new Promise((res,rej)=>{
 const r=indexedDB.open('prep-ledger-files',1);
 r.onupgradeneeded=()=>r.result.createObjectStore('h');
 r.onsuccess=()=>{db=r.result;res(db);};r.onerror=()=>rej(r.error);});
 return{put:(k,v)=>open().then(d=>new Promise(res=>{const t=d.transaction('h','readwrite');t.objectStore('h').put(v,k);t.oncomplete=res;})),
  get:k=>open().then(d=>new Promise(res=>{const t=d.transaction('h','readonly'),q=t.objectStore('h').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null);}))};
})();

function vProjection(){
 const t=todayISO();
 const all=S.subjects.flatMap(s=>s.topics.map(x=>({...x,sub:s.name})));
 const total=all.length,solid=all.filter(x=>x.status===3).length,started=all.filter(x=>x.status>0).length;
 const win=56;
 const recent=all.filter(x=>x.solidAt&&between(x.solidAt,t)<=win).length;
 const perWeek=recent/(win/7);
 const left=total-solid;
 const weeksLeft=perWeek>0?left/perWeek:null;
 const finish=weeksLeft!==null?shift(t,Math.ceil(weeksLeft*7)):null;
 const next=stageCounters().find(x=>x.d>=t);
 const daysToExam=next?between(t,next.d):null;
 const needPerWeek=daysToExam&&left?left/(daysToExam/7):null;
 const verdict=(()=>{
  if(!total)return{k:'none',m:'Add topics under your subjects and this page starts working.'};
  if(!recent)return{k:'none',m:'Nothing has been marked Solid in the last eight weeks, so there is no pace to project from yet.'};
  if(!daysToExam)return{k:'ok',m:'Set an exam date and this will tell you whether the pace lands in time.'};
  if(finish<=next.d)return{k:'ok',m:'At your current pace the syllabus closes about '+between(finish,next.d)+' days before '+(next.n||'the exam')+'.'};
  return{k:'bad',m:'At this pace the syllabus closes '+between(next.d,finish)+' days after '+(next.n||'the exam')+'. You would need '+needPerWeek.toFixed(1)+' topics a week instead of '+perWeek.toFixed(1)+'.'};
 })();
 const bySub=S.subjects.map(s=>{
  const n=s.topics.length,d=s.topics.filter(x=>x.status===3).length;
  const r=s.topics.filter(x=>x.solidAt&&between(x.solidAt,t)<=win).length/(win/7);
  return{n:s.name,total:n,done:d,rate:r,eta:r>0&&n-d>0?shift(t,Math.ceil((n-d)/r*7)):null};
 }).filter(x=>x.total);
 return`<h2>Syllabus projection</h2>
 <p class="small muted" style="max-width:68ch">Based on topics you have marked Solid in the last eight weeks. Mark topics honestly on the Subjects page and this stays honest too.</p>
 <div class="grid g4">
  ${stat(total?Math.round(solid/total*100)+'%':'—','of the syllabus solid')}
  ${stat(solid+'/'+total,'topics closed')}
  ${stat(perWeek?perWeek.toFixed(1):'—','topics a week, recent pace')}
  ${stat(finish?fmtDate(finish):'—','projected finish',verdict.k==='bad'?'var(--rust)':'var(--deep)')}</div>
 <div class="card sec" style="border-left:4px solid ${verdict.k==='bad'?'var(--rust)':verdict.k==='ok'?'var(--deep)':'var(--amber)'}">
  <h3>Where this is heading</h3><p class="small" style="margin-top:6px">${esc(verdict.m)}</p>
  ${needPerWeek?`<div class="grid g2" style="margin-top:12px">
   <div><b class="num" style="font-family:var(--serif);font-size:22px">${perWeek.toFixed(1)}</b><div class="small muted">topics a week now</div></div>
   <div><b class="num" style="font-family:var(--serif);font-size:22px;color:${needPerWeek>perWeek?'var(--rust)':'var(--deep)'}">${needPerWeek.toFixed(1)}</b>
    <div class="small muted">needed to finish in time</div></div></div>`:''}</div>
 <div class="card sec"><h3>Overall</h3>
  <div class="bar" style="margin-top:10px;height:14px">
   <i style="width:${total?solid/total*100:0}%"></i></div>
  <div class="row small muted" style="margin-top:6px;justify-content:space-between">
   <span>${solid} solid · ${started-solid} in progress · ${total-started} untouched</span>
   <span class="num">${total} topics</span></div></div>
 ${bySub.length?`<div class="card sec"><h3>Subject by subject</h3>
  <table style="margin-top:8px"><thead><tr><th>Subject</th><th>Solid</th><th>Pace</th><th>Finishes</th></tr></thead><tbody>
  ${bySub.map(x=>`<tr><td>${esc(x.n)}<div class="bar" style="margin-top:4px;max-width:180px"><i style="width:${x.done/x.total*100}%"></i></div></td>
   <td class="num">${x.done}/${x.total}</td><td class="num">${x.rate?x.rate.toFixed(1)+'/wk':'—'}</td>
   <td class="num ${x.eta&&next&&x.eta>next.d?'':''}" style="${x.eta&&next&&x.eta>next.d?'color:var(--rust)':''}">${x.eta?fmtDate(x.eta):(x.done===x.total?'done':'—')}</td></tr>`).join('')}
  </tbody></table></div>`:'<div class="empty sec">No topics yet. Add them under Subjects and progress.</div>'}`;
}
function vReport(){

 </div>

  ${subs.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${hrs(v).toFixed(1)}h</td>
   <td class="num">${(v/tot*100).toFixed(0)}%</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty sec">Nothing logged this month.</div>'}
 ${stageCounters().length?`<div class="card sec small">${stageCounters().map(x=>{const n=between(todayISO(),x.d);

 const d=tourEl();d.className='on';

function tourPaint(st,el){
 const d=tourEl();if(!d)return;
 const W=innerWidth,H=innerHeight;
 const r=el?el.getBoundingClientRect():null;
 const pad=8,hx=r?r.left-pad:W/2,hy=r?r.top-pad:H/2,hw=r?r.width+pad*2:0,hh=r?r.height+pad*2:0;
 const last=tourI===TOUR.length-1;
 let bub='',arrow='';
 if(!r){bub=`<div class="tbub tcenter">${tourBody(st,last)}</div>`;}
 else{
  const below=hy+hh+180<H, bw=Math.min(330,W-32);
  let bx=Math.min(Math.max(12,hx+hw/2-bw/2),W-bw-12);
  let by=below?hy+hh+34:Math.max(12,hy-34-190);
  bub=`<div class="tbub" style="left:${bx}px;top:${by}px;width:${bw}px">${tourBody(st,last)}</div>`;
  const sx=bx+bw/2, sy=below?by-10:by+180, tx=hx+hw/2, ty=below?hy+hh+6:hy-6;
  const cx=sx+(tx-sx)*0.15+(below?70:-70), cy=(sy+ty)/2;
  const len=Math.hypot(tx-sx,ty-sy)*1.5+60;
  arrow=`<svg id="tourArrow" style="--len:${len.toFixed(0)}">
   <path d="M${sx},${sy} Q${cx},${cy} ${tx},${ty}"/>
   <path d="M${tx},${ty} l${below?-7:-6},${below?-9:9} M${tx},${ty} l${below?8:7},${below?-8:8}"/></svg>`;
 }
 d.innerHTML=`<svg id="tourMask" width="${W}" height="${H}">
   <defs><mask id="tm"><rect width="${W}" height="${H}" fill="#fff"/>
   ${r?`<rect class="hole" x="${hx}" y="${hy}" width="${hw}" height="${hh}" rx="16" fill="#000"/>`:''}</mask></defs>
   <rect width="${W}" height="${H}" fill="rgba(9,20,38,.62)" mask="url(#tm)"/></svg>
  ${r?`<div id="tourRing" style="left:${hx}px;top:${hy}px;width:${hw}px;height:${hh}px"></div>`:''}
  ${arrow}${bub}`;
}

setInterval(()=>{const n=document.getElementById('useLine');
 if(n&&!n.dataset.done){n.dataset.done='1';storageUse().then(v=>{if(v)n.textContent='Storage: '+v;});}},1500);
if(S.setup&&!S.settings.tourDone&&!S.sessions.length)setTimeout(tourOffer,500);
function tourOffer(){
 if(!tourEl()){const d=document.createElement('div');d.id='tour';document.body.appendChild(d);}
 const d=tourEl();d.className='on';
 d.innerHTML=`<svg id="tourMask" width="${innerWidth}" height="${innerHeight}">
   <rect width="100%" height="100%" fill="rgba(9,20,38,.62)"/></svg>
  <div class="tbub tcenter"><h3>Would you like a quick tour?</h3>
   <p>About a minute, ten short stops, and it points at each part as it goes. You can also start it later from Settings.</p>
   <div class="row" style="justify-content:flex-end;margin-top:14px">
    <button class="btn sm" data-a="tourEnd">Skip it</button>
    <button class="btn p sm" data-a="tourGo">Show me around</button></div></div>`;
}
</script>
</body>
</html>
